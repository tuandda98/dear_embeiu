<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>

    <!-- Background: deep sunset → twilight purple -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FF6B9D"/>
      <stop offset="48%"  stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#9B4DCA"/>
    </linearGradient>

    <!-- Soft radial shine top-left -->
    <radialGradient id="bgShine" cx="32%" cy="22%" r="52%">
      <stop offset="0%"   stop-color="#FFAEC8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>

    <!-- Heart left half fill (white) -->
    <linearGradient id="heartLeft" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE8F0"/>
    </linearGradient>

    <!-- Heart right half fill (lavender) -->
    <linearGradient id="heartRight" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#D8AAFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Heart glow/shadow -->
    <filter id="heartGlow" x="-22%" y="-22%" width="144%" height="144%">
      <feDropShadow dx="0" dy="18" stdDeviation="36" flood-color="#7B1FA2" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4"  stdDeviation="12" flood-color="#C2185B" flood-opacity="0.22"/>
    </filter>

    <!-- Clip: left half of heart -->
    <clipPath id="clipLeft">
      <rect x="0" y="0" width="512" height="1024"/>
    </clipPath>

    <!-- Clip: right half of heart -->
    <clipPath id="clipRight">
      <rect x="512" y="0" width="512" height="1024"/>
    </clipPath>

    <!-- Gloss highlight mask -->
    <radialGradient id="gloss" cx="38%" cy="28%" r="46%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#bgShine)"/>

  <!-- Subtle ring decorations -->
  <circle cx="512" cy="480" r="400" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
  <circle cx="512" cy="480" r="310" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- Corner ambient blobs -->
  <circle cx="130"  cy="130"  r="210" fill="rgba(255,255,255,0.055)"/>
  <circle cx="900"  cy="920"  r="270" fill="rgba(120,0,160,0.16)"/>

  <!-- ── Heart shape (rendered in two halves) ── -->

  <!-- Heart path (shared geometry, clipped left = white) -->
  <path clip-path="url(#clipLeft)"
    d="M 512 756
       C 512 756 178 566 178 336
       C 178 238 252 162 344 162
       C 410 162 468 196 512 248
       C 556 196 614 162 680 162
       C 772 162 846 238 846 336
       C 846 566 512 756 512 756 Z"
    fill="url(#heartLeft)"
    filter="url(#heartGlow)"/>

  <!-- Heart path (clipped right = lavender) -->
  <path clip-path="url(#clipRight)"
    d="M 512 756
       C 512 756 178 566 178 336
       C 178 238 252 162 344 162
       C 410 162 468 196 512 248
       C 556 196 614 162 680 162
       C 772 162 846 238 846 336
       C 846 566 512 756 512 756 Z"
    fill="url(#heartRight)"
    filter="url(#heartGlow)"/>

  <!-- Thin seam line between two halves (subtle depth) -->
  <line x1="512" y1="162" x2="512" y2="756"
    stroke="rgba(255,255,255,0.28)" stroke-width="3"
    clip-path="url(#clipLeft)"/>

  <!-- Heart gloss highlight (top-left) -->
  <path d="M 362 226
             C 336 226 306 246 292 278
             C 274 318 290 358 318 390
             C 318 390 338 348 382 320
             C 364 300 354 272 362 226 Z"
    fill="rgba(255,255,255,0.22)"/>

  <!-- ── Two small hearts inside = couple detail ── -->
  <!-- Left small heart (white, subtle) -->
  <path d="M 424 476
             C 424 476 348 428 348 376
             C 348 352 366 334 388 334
             C 402 334 414 342 424 354
             C 434 342 446 334 460 334
             C 482 334 500 352 500 376
             C 500 428 424 476 424 476 Z"
    fill="rgba(255,255,255,0.20)"/>

  <!-- Right small heart (lavender, subtle) -->
  <path d="M 600 476
             C 600 476 524 428 524 376
             C 524 352 542 334 564 334
             C 578 334 590 342 600 354
             C 610 342 622 334 636 334
             C 658 334 676 352 676 376
             C 676 428 600 476 600 476 Z"
    fill="rgba(200,160,255,0.22)"/>

  <!-- ── Sparkle dots ── -->
  <circle cx="252" cy="248" r="10" fill="rgba(255,255,255,0.62)"/>
  <circle cx="772" cy="248" r="10" fill="rgba(255,255,255,0.62)"/>
  <circle cx="196" cy="428" r="7"  fill="rgba(255,255,255,0.44)"/>
  <circle cx="828" cy="428" r="7"  fill="rgba(255,255,255,0.44)"/>
  <circle cx="512" cy="812" r="6"  fill="rgba(255,255,255,0.28)"/>

  <!-- 4-point star sparkle top-center -->
  <path d="M 512 110 L 519 132 L 542 132 L 524 146 L 531 168 L 512 154 L 493 168 L 500 146 L 482 132 L 505 132 Z"
    fill="rgba(255,255,255,0.52)"/>

  <!-- Small star right -->
  <path d="M 810 168 L 815 182 L 830 182 L 818 191 L 823 205 L 810 196 L 797 205 L 802 191 L 790 182 L 805 182 Z"
    fill="rgba(255,255,255,0.36)"/>

  <!-- ── Outer gloss on rounded square ── -->
  <rect width="1024" height="1024" rx="230" fill="url(#gloss)"/>

</svg>
