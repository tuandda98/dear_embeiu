<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <!-- Heart gradient -->
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="110%">
      <stop offset="0%"   stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Inner glow -->
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%"   stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </radialGradient>

    <filter id="heartShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#be185d" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle radial inner glow -->
  <ellipse cx="256" cy="210" rx="200" ry="180" fill="url(#glow)" opacity="0.6"/>

  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(236,72,153,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="rgba(236,72,153,0.06)" stroke-width="1.5"/>

  <!-- Main heart shape -->
  <!-- Heart built with two bezier curves + bottom point -->
  <path d="
    M 256 360
    C 256 360 104 264 104 172
    C 104 128 136 96 176 96
    C 208 96 232 116 256 140
    C 280 116 304 96 336 96
    C 376 96 408 128 408 172
    C 408 264 256 360 256 360 Z
  " fill="url(#heart)" filter="url(#heartShadow)"/>

  <!-- Heart inner highlight -->
  <path d="
    M 200 136
    C 185 136 168 148 162 168
    C 155 195 170 220 190 240
    C 190 240 200 210 228 190
    C 218 178 210 162 200 136 Z
  " fill="rgba(255,255,255,0.22)" />

  <!-- Small decorative dots -->
  <circle cx="148" cy="148" r="5" fill="rgba(236,72,153,0.25)"/>
  <circle cx="364" cy="148" r="5" fill="rgba(236,72,153,0.25)"/>
  <circle cx="120" cy="320" r="3.5" fill="rgba(236,72,153,0.2)"/>
  <circle cx="392" cy="320" r="3.5" fill="rgba(236,72,153,0.2)"/>
  <circle cx="256" cy="420" r="4"   fill="rgba(236,72,153,0.18)"/>

  <!-- Letter "D" subtle watermark at bottom -->
  <text
    x="256" y="470"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="4"
    fill="rgba(190,24,93,0.3)"
    text-anchor="middle"
  >DEAR EMBEIU</text>
</svg>
