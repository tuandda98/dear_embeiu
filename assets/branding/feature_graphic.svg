<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Dear Embeiu — Play Store feature graphic (1024x500).
    Re-synced to the app: light "Sunset Romance" surface, navy serif wordmark,
    coral accents, and a phone mock that mirrors the real Home screen.
    Same palette as app_icon.svg / lib/theme/app_colors.dart.
  -->
  <defs>
    <!-- Light blush background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFF1F5"/>
      <stop offset="55%"  stop-color="#FFDCE6"/>
      <stop offset="100%" stop-color="#FFC9D6"/>
    </linearGradient>

    <!-- Atmosphere blobs -->
    <radialGradient id="glowSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF8FA3" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FF8FA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLav" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A78BFA" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Sunset gradient (icon tile + counter card) -->
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF6B9D"/>
      <stop offset="55%"  stop-color="#FF7E9C"/>
      <stop offset="100%" stop-color="#FF8FA3"/>
    </linearGradient>
    <radialGradient id="tileShine" cx="32%" cy="24%" r="60%">
      <stop offset="0%"   stop-color="#FFB6C1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB6C1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F4"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#E63956" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF6B9D" flood-opacity="0.28"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="46"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <ellipse cx="250" cy="120" rx="320" ry="260" fill="url(#glowSun)" filter="url(#blur)"/>
  <ellipse cx="900" cy="440" rx="300" ry="240" fill="url(#glowLav)" filter="url(#blur)"/>

  <!-- Faint decorative rings -->
  <circle cx="120" cy="430" r="150" fill="none" stroke="#FF6B9D" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="120" cy="430" r="110" fill="none" stroke="#FF6B9D" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Floating sparkles -->
  <circle cx="470" cy="60"  r="3"   fill="#FF4D6D" fill-opacity="0.45"/>
  <circle cx="360" cy="120" r="2"   fill="#A78BFA" fill-opacity="0.5"/>
  <circle cx="540" cy="150" r="2"   fill="#FF6B9D" fill-opacity="0.45"/>
  <circle cx="80"  cy="200" r="2.5" fill="#FF8FA3" fill-opacity="0.4"/>

  <!-- ===================== LEFT — BRAND ===================== -->

  <!-- Logo tile (mini app icon) -->
  <g>
    <rect x="64" y="62" width="64" height="64" rx="16" fill="url(#sunset)" filter="url(#cardShadow)"/>
    <rect x="64" y="62" width="64" height="64" rx="16" fill="url(#tileShine)"/>
    <path d="M 96 116
             C 96 116 75 104 75 90
             C 75 84 80 79 86 79
             C 90 79 94 81 96 84
             C 98 81 102 79 106 79
             C 112 79 117 84 117 90
             C 117 104 96 116 96 116 Z"
      fill="url(#heart)"/>
  </g>

  <!-- Badge pill -->
  <rect x="146" y="78" width="206" height="34" rx="17" fill="#FFFFFF" filter="url(#softShadow)"/>
  <path d="M 168 88 C 168 85 165.5 83 163 83 C 160.5 83 158 85 158 88 C 158 91.5 163 96 163 96 C 163 96 168 91.5 168 88 Z" fill="#FF4D6D"/>
  <text x="178" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#FF4D6D" letter-spacing="0.3">Dành cho cặp đôi</text>

  <!-- Wordmark -->
  <text x="62" y="208" font-family="Georgia,'Times New Roman',serif" font-size="66" font-weight="700" fill="#1A1A2E" letter-spacing="-1.5">Dear</text>
  <text x="62" y="280" font-family="Georgia,'Times New Roman',serif" font-size="66" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#FF4D6D">Em</tspan><tspan fill="#1A1A2E">beiu</tspan>
  </text>

  <!-- Tagline -->
  <text x="64" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#6B6B7B" letter-spacing="0.1">Lưu kỷ niệm · Đếm ngày yêu · Chia sẻ khoảnh khắc</text>

  <!-- Divider -->
  <rect x="64" y="340" width="64" height="4" rx="2" fill="#FF4D6D"/>

  <!-- Feature pills -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">
    <rect x="64"  y="364" width="190" height="34" rx="17" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="84" cy="381" r="3.5" fill="#FF4D6D"/>
    <text x="96" y="386">Kỷ niệm ngày yêu</text>

    <rect x="266" y="364" width="150" height="34" rx="17" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="286" cy="381" r="3.5" fill="#A78BFA"/>
    <text x="298" y="386">Thư viện ảnh</text>

    <rect x="64"  y="408" width="172" height="34" rx="17" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="84" cy="425" r="3.5" fill="#FF8FA3"/>
    <text x="96" y="430">Nhắc nhau mỗi ngày</text>

    <rect x="248" y="408" width="168" height="34" rx="17" fill="#FFFFFF" filter="url(#softShadow)"/>
    <circle cx="268" cy="425" r="3.5" fill="#66BB6A"/>
    <text x="280" y="430">Chỉ 2 người biết</text>
  </g>

  <!-- ===================== RIGHT — PHONE MOCK ===================== -->

  <!-- Phone -->
  <rect x="628" y="48" width="332" height="404" rx="38" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="642" y="62" width="304" height="376" rx="28" fill="#FAFAFC"/>
  <rect x="772" y="74" width="44" height="7" rx="3.5" fill="#E6E0E6"/>

  <!-- Day counter card -->
  <rect x="660" y="96" width="268" height="116" rx="22" fill="url(#sunset)" filter="url(#cardShadow)"/>
  <rect x="660" y="96" width="268" height="116" rx="22" fill="url(#tileShine)"/>
  <text x="794" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle" letter-spacing="2">CHÚNG MÌNH ĐÃ BÊN NHAU</text>
  <text x="794" y="172" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">365</text>
  <text x="794" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle" letter-spacing="2">NGÀY</text>

  <!-- Couple row -->
  <rect x="660" y="226" width="268" height="50" rx="16" fill="#FFFFFF" stroke="#F0E6EC" stroke-width="1"/>
  <circle cx="688" cy="251" r="15" fill="#FFD6E0"/>
  <text x="688" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#FF4D6D" text-anchor="middle">A</text>
  <text x="716" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#1A1A2E">Anh</text>
  <path d="M 800 248 C 800 244 796.5 241 793 241 C 789.5 241 786 244 786 248 C 786 253 793 259 793 259 C 793 259 800 253 800 248 Z" fill="#FF4D6D"/>
  <text x="812" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#1A1A2E">Em</text>
  <circle cx="900" cy="251" r="15" fill="#E0D4F7"/>
  <text x="900" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">E</text>

  <!-- Photo grid -->
  <defs>
    <linearGradient id="ph1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFD6E0"/><stop offset="100%" stop-color="#FFB6C1"/></linearGradient>
    <linearGradient id="ph2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E0D4F7"/><stop offset="100%" stop-color="#C8A8E9"/></linearGradient>
    <linearGradient id="ph3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE0E0"/><stop offset="100%" stop-color="#FF8FA3"/></linearGradient>
    <linearGradient id="ph4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFD6E0"/><stop offset="100%" stop-color="#C6E5D9"/></linearGradient>
  </defs>
  <rect x="660" y="290" width="128" height="64" rx="14" fill="url(#ph1)"/>
  <rect x="800" y="290" width="128" height="64" rx="14" fill="url(#ph2)"/>
  <rect x="660" y="366" width="84"  height="58" rx="14" fill="url(#ph3)"/>
  <rect x="756" y="366" width="84"  height="58" rx="14" fill="url(#ph4)"/>
  <rect x="852" y="366" width="76"  height="58" rx="14" fill="#F0E6EC"/>
  <text x="890" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#A0A0B0" text-anchor="middle">+9</text>

  <!-- Mini hearts floating around phone -->
  <path d="M 612 150 C 612 146 608.5 143 605 143 C 601.5 143 598 146 598 150 C 598 155 605 161 605 161 C 605 161 612 155 612 150 Z" fill="#FF6B9D" fill-opacity="0.55" filter="url(#softShadow)"/>
  <path d="M 980 320 C 980 317 977 314 974 314 C 971 314 968 317 968 320 C 968 324 974 329 974 329 C 974 329 980 324 980 320 Z" fill="#A78BFA" fill-opacity="0.5"/>
</svg>
