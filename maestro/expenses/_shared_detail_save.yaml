# Sau khi đã gõ số tiền ở form SỔ CHUNG: mở phần chi tiết, chọn ai trả + cách chia + không trừ ví riêng,
# ghi chú, Lưu. Env: PAYER ('Mình'), SPLIT ('Chia đôi' | 'Trả hộ' ...), NOTE (ASCII),
# AMOUNT_TEXT (regex số tiền hiện trên nút Lưu, vd '1\.000\.000').
appId: com.tony.dearembeiu.dev
---
- tapOn: '(?s).+ trả( · .+)? · Hôm nay.*'
- extendedWaitUntil:
    visible: '(?s).*Ai trả.*'
    timeout: 5000
- tapOn: '${PAYER}'
- tapOn: '${SPLIT}'
- runFlow:
    when:
      visible: '(?s).*Không trừ.*'
    commands:
      - tapOn: 'Không trừ'
- tapOn: 'Ghi chú.*'
- inputText: ${NOTE}
- tapOn: 'Lưu ${AMOUNT_TEXT}.*'
- extendedWaitUntil:
    visible: 'Đã ghi ${AMOUNT_TEXT}.*'
    timeout: 8000
