# CẶP 2 MÁY, bước 4: Tuấn (Android) thấy hai bên ngang nhau + dòng "Thanh toán" (không tính vào chi).
appId: com.tony.dearembeiu.dev
---
- launchApp
- extendedWaitUntil:
    visible: '.*Hôm nay của chúng mình.*'
    timeout: 30000
- runFlow: _open_money.yaml
- tapOn: 'Chung'
- scrollUntilVisible:
    element:
      text: '(?s).*Hai bên đang ngang nhau.*'
    direction: UP
    centerElement: true
    timeout: 40000
- scrollUntilVisible:
    element:
      text: 'Thanh toán, .*không tính vào chi.*'
    centerElement: true
    timeout: 40000
