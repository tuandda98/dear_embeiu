# CẶP 2 MÁY, bước 9 (cuối): Tuấn (Android) thấy khoản trả hộ, số lệch 70k, rồi thanh toán cho về 0.
appId: com.tony.dearembeiu.dev
---
- runScript: _run_id.js
- launchApp
- extendedWaitUntil:
    visible: '.*Hôm nay của chúng mình.*'
    timeout: 30000
- runFlow: _open_money.yaml
- tapOn: 'Chung'
- scrollUntilVisible:
    element:
      text: 'MTH${output.run}, .*trả hộ.*'
    centerElement: true
    timeout: 40000
- scrollUntilVisible:
    element:
      text: '.*đang ứng nhiều hơn.*'
    direction: UP
    centerElement: true
    timeout: 40000
- tapOn: 'Thanh toán'
- runFlow:
    when:
      visible: '(?s).*Tải số mới nhất.*'
    commands:
      - tapOn: 'Tải số mới nhất'
- extendedWaitUntil:
    visible: '(?s).*Đánh dấu đã thanh toán.*'
    timeout: 10000
- tapOn: 'Đánh dấu đã thanh toán'
- extendedWaitUntil:
    visible: '(?s).*Hai bên đang ngang nhau.*'
    timeout: 15000
