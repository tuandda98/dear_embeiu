# Chuyển 10k từ Tiền mặt sang ví MTW: dòng "A → B", không tính vào chi.
appId: com.tony.dearembeiu.dev
---
- runScript: _run_id.js
- launchApp
- extendedWaitUntil:
    visible: '.*Hôm nay của chúng mình.*'
    timeout: 30000
- runFlow: _open_money.yaml
- tapOn: 'Của mình'
- runFlow: _ensure_wallet_mtw.yaml
- back
- tapOn: 'Ghi khoản'
- tapOn: 'Chuyển'
- tapOn: '1'
- tapOn: '0'
- tapOn: 'nghìn'
- tapOn: '(?s)(Cash|Tiền mặt).*'
- tapOn:
    text: '(?s)MTW.*'
    index: 1
- tapOn: 'Hôm nay · Thêm ghi chú'
- tapOn: 'Ghi chú.*'
- inputText: MTT${output.run}
- tapOn: 'Lưu 10\.000.*'
- extendedWaitUntil:
    visible: '(?s).*Đã ghi 10\.000.*chuyển ví.*'
    timeout: 8000
- scrollUntilVisible:
    element:
      text: 'MTT${output.run}, .*→ MTW.*'
    centerElement: true
    timeout: 40000
