appId: com.tony.dearembeiu.dev
---
# Thảo, nước 4: O hàng 9, cột 9. Vào ván từ thẻ Home.
- launchApp
- extendedWaitUntil:
    visible: '.*Hôm nay của chúng mình.*'
    timeout: 30000
- scrollUntilVisible:
    element: 'Cờ caro\. Đến lượt bạn.*'
    centerElement: true
    visibilityPercentage: 60
    speed: 30
    timeout: 40000
- waitForAnimationToEnd
- tapOn: 'Cờ caro\. Đến lượt bạn.*'
- waitForAnimationToEnd
- assertVisible: 'Đến lượt bạn\. .*'
- runFlow: _lib_zoom_out.yaml
- tapOn: '(?s)Hàng 9, cột 9, trống.*'
- waitForAnimationToEnd
- assertVisible: 'Đang chờ .*\. .*'
- assertVisible: 'Hàng 9, cột 9, quân O của .*'
