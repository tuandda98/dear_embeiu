appId: com.tony.dearembeiu.dev
---
# Tuấn, nước 5: X hàng 10, cột 8. Trước khi đi thử mất mạng (chỉ Android).
# CARO-NET: nút đổi thành "Chờ có mạng" + ghi chú mất mạng; có mạng lại thì đi được.
- launchApp
- extendedWaitUntil:
    visible: '.*Hôm nay của chúng mình.*'
    timeout: 30000
- scrollUntilVisible:
    element: 'Cờ caro\. Đến lượt bạn.*'
    centerElement: true
    visibilityPercentage: 60
    speed: 30
    timeout: 40000
- waitForAnimationToEnd
- tapOn: 'Cờ caro\. Đến lượt bạn.*'
- waitForAnimationToEnd
- runFlow: _lib_zoom_out.yaml
- setAirplaneMode: enabled
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Đang mất mạng.*'
    timeout: 15000
- assertVisible:
    text: '(?s)Chờ có mạng.*'
    enabled: false
# Offline: chạm ô không gửi nước.
- tapOn: '(?s)Hàng 10, cột 8, trống.*'
- assertNotVisible: 'Hàng 10, cột 8, quân .*'
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: 'Đang mất mạng.*'
    timeout: 30000
- tapOn: '(?s)Hàng 10, cột 8, trống.*'
- waitForAnimationToEnd
- assertVisible: 'Hàng 10, cột 8, quân X của .*'
