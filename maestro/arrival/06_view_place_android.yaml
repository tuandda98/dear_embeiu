# 06 (Android, Tuấn) — thấy Thảo "Đã đến Công ty" + nút "Hỏi thăm Thảo". Chạy sau 05_manual_place_ios.
# Kiểm: SK-10, NA-14.
appId: com.tony.dearembeiu.dev
---
- launchApp
- extendedWaitUntil:
    visible: '.*Hôm nay của chúng mình.*'
    timeout: 30000
- runFlow: _sub/scroll_to_card.yaml
- extendedWaitUntil:
    visible: '(?s).*Đã đến Công ty.*'
    timeout: 45000
- assertVisible: '(?s).*Hỏi thăm Thảo.*'
- takeScreenshot: 06_view_place_android
