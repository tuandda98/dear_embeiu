# 03 (iOS, Thảo) — thấy Tuấn "Đã về đến nhà" (bấm tay), nút "Hỏi thăm Tuấn" mở màn Quan tâm có tiêu đề gợi ý.
# Kiểm: NA-03, SK-16, NA-14, AY-02. Chạy sau 02_manual_home_android (Thảo chưa chia sẻ → D10).
appId: com.tony.dearembeiu.dev
---
- launchApp
- extendedWaitUntil:
    visible: '.*Hôm nay của chúng mình.*'
    timeout: 30000
- runFlow: _sub/scroll_to_card.yaml
- extendedWaitUntil:
    visible: '(?s).*Đã về đến nhà.*'
    timeout: 45000
- assertVisible: '(?s).*bấm tay.*'
- tapOn: 'Hỏi thăm Tuấn'
- waitForAnimationToEnd
- assertVisible: '(?s).*Về tới nơi rồi thì nghỉ ngơi nhé.*'
- takeScreenshot: 03_view_home_ios
- tapOn: 'Quay lại'