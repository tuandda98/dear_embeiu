name: dear_embeiu
description: "Dear Embeiu — lưu giữ kỷ niệm và đếm ngày yêu cùng người ấy."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.1+6

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.0

  # Firebase (Sprint 2 integration)
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  cloud_functions: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.2
  firebase_crashlytics: ^5.2.2

  # Image handling
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^19.4.0

  # Gallery and grid layout
  flutter_staggered_grid_view: ^0.7.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Date formatting
  intl: ^0.20.2

  # File operations
  path_provider: ^2.1.1

  # UUID generation
  uuid: ^4.0.0

  # Auth/session scaffolding
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4

  # Open URLs in browser
  url_launcher: ^6.3.1

  # Native share sheet for invite code (feature invite-sharing, Phase 1)
  share_plus: ^11.0.0

  # Scheduled local notifications for retention "love reminders"
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # UI/UX revamp foundation (Đợt 1): motion, skeletons, celebration.
  # Typography is bundled (Be Vietnam Pro in assets/fonts) — no runtime font
  # fetch, so we dropped google_fonts (was the cause of iOS diacritic glitches).
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lucide_icons: ^0.257.0
  confetti: ^0.8.0

  # Lottie "moment" animations (feature lottie-moments, Đợt 2 revamp).
  # Dùng có chọn lọc ở vài khoảnh khắc cảm xúc; slot thiếu file tự fallback.
  lottie: ^3.3.3
  firebase_analytics: ^12.4.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

  # Code generation for Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Enable generation of localizations (gen-l10n) from lib/l10n/*.arb.
  generate: true

  # Lottie "moment" animations (feature lottie-moments). Chỉ file có thật trong
  # thư mục mới được bundle — slot thiếu file thì widget LoveLottie tự fallback.
  assets:
    - assets/lottie/

  # Bundled app fonts (OFL, full Vietnamese, offline — never fetched at
  # runtime). Active family: Quicksand (rounded, "mịn màng nhẹ nhàng",
  # 2026-06-10). Max real weight is 700 — w800 call-sites resolve to the Bold
  # file (declared twice on purpose). Be Vietnam Pro stays bundled as the
  # previous family for a cheap rollback.
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Light.ttf
          weight: 300
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 800
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Light.ttf
          weight: 300
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  # Brand: "Sunset Romance" (see lib/theme/app_colors.dart)
  android: true
  ios: true
  # Android adaptive icon: full-bleed gradient bg + white-heart foreground,
  # so modern launchers mask cleanly with no white ring behind the icon.
  adaptive_icon_background: "assets/branding/adaptive_bg.png"
  adaptive_icon_foreground: "assets/branding/adaptive_fg.png"
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#FF6B9D"
    theme_color: "#FF4D6D"
  image_path: assets/branding/app_icon.png
  # iOS forbids alpha; flatten the rounded-tile corners onto the brand pink
  # (iOS then applies its own squircle mask).
  remove_alpha_ios: true
  background_color_ios: "#FF6B9D"

# Native launch splash — brand pink (#FF6B9D = sunset1) + white heart logo,
# a seamless lead-in to the in-app SplashScreen (same heart + sunset gradient).
flutter_native_splash:
  color: "#FF6B9D"
  image: assets/branding/splash_logo.png
  color_dark: "#FF6B9D"
  image_dark: assets/branding/splash_logo.png
  android: true
  ios: true
  web: false
  # Android 12+ uses the system splash API (solid bg + masked icon).
  android_12:
    color: "#FF6B9D"
    image: assets/branding/splash_logo.png
    color_dark: "#FF6B9D"
    image_dark: assets/branding/splash_logo.png

