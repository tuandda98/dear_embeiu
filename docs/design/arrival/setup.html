<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrival · bật lần đầu · mock bấm thử</title>
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="ui.js"></script>
<style>
  .frame { padding: 16px 16px 32px; }
  .frame + .frame { border-top: 8px solid rgba(255,255,255,.35); }
  .lbl { font-size: 13px; font-weight: 700; margin: 0 4px 8px; }
  .push { display: flex; gap: 10px; align-items: flex-start; background: #fff; border-radius: 16px; padding: 12px; }
  .appic { width: 28px; height: 28px; border-radius: 7px; background: #FF6B9D; color: #fff; display: grid; place-items: center; flex: none; }
  .push .t { font-size: 14px; font-weight: 700; } .push .b { font-size: 13px; font-weight: 500; } .push .w { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
  .cta { margin-top: 24px; }
  .cta .btn.text { width: 100%; height: 44px; margin-top: 4px; }
  .ring { display: flex; align-items: center; gap: 16px; }
  .ring svg { flex: none; }
  .place { display: flex; align-items: center; gap: 14px; }
  .place .tx { flex: 1; } .place .tt { font-size: 15px; font-weight: 700; } .place .ts { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .optlist { background: #fff; border-radius: 16px; overflow: hidden; }
  .optlist div { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 15px; font-weight: 600; }
  .optlist div + div { border-top: 1px solid var(--hair); }
  .optlist .on { background: rgba(26,26,46,.06); font-weight: 700; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; }
  @media (prefers-reduced-motion: no-preference) { .spin { animation: r .8s linear infinite; } @keyframes r { to { transform: rotate(360deg); } } }
</style>
</head>
<body>
<header class="doc">
  <h1>Bật “Về đến nhà” lần đầu</h1>
  <p>Chỉ hỏi quyền lúc bật tự báo: hộp giải thích (Play bắt buộc) → quyền khi dùng app → Luôn luôn. Lưu nơi bằng địa chỉ không cần quyền (xem place.html). Bấm nút chính để đi tiếp.</p>
</header>
<main id="m"></main>
<script>
const { I } = UI; const me = D.people.me.name, pn = D.people.partner.name, R = D.RADIUS_M;
const head = `<div class="ssh"><button class="back" aria-label="Quay lại">${I.back()}</button><span class="chip">${I.home(13)}Về đến nhà</span></div>`;
const steps = (n) => `<div class="steps" role="img" aria-label="Bước ${n} trên 2">${[1,2].map((i) => `<i class="${i === n ? 'on' : ''}"></i>`).join('')}</div>`;
const push = (t, b) => `<div class="push"><span class="appic">${I.heart(14)}</span><div><p class="t">${t}</p><p class="b">${b}</p></div><span class="w">bây giờ</span></div>`;
const ring = (state) => `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44" fill="${state === 'saved' ? 'rgba(255,77,109,.10)' : 'rgba(26,26,46,.05)'}" stroke="${state === 'saved' ? 'rgba(255,77,109,.45)' : 'rgba(26,26,46,.18)'}" stroke-width="1.5"/><circle cx="48" cy="48" r="18" fill="#fff"/><g transform="translate(38 38)" color="${state === 'saved' ? '#FF4D6D' : '#1A1A2E'}">${I.home(20)}</g></svg><div><p class="tt" style="font-size:15px;font-weight:700">Nhà${state === 'saved' ? ' · đã lưu' : ''}</p><p class="fine" style="margin-top:2px">Vòng tròn ${R} m quanh chỗ bạn đứng. Vào vòng này là tính “đã về”.</p></div></div>`;

const F = [];
F.push(['need-place', 'Bật tự báo khi chưa có nơi nào có vị trí', `${head}
  <h2 class="hero-title">Trước hết, nhà bạn ở đâu?</h2>
  <p class="body" style="margin-top:12px">Máy cần biết Nhà ở đâu thì mới tự báo được. Gõ địa chỉ là xong, chưa cần cấp quyền gì.</p>
  <div class="card" style="margin-top:20px"><div class="ring"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="rgba(26,26,46,.05)"/><g transform="translate(18 18)" color="#1A1A2E">${I.home(20)}</g></svg><div><p style="font-size:15px;font-weight:700">Nhà</p><p class="fine" style="margin-top:2px">Chưa đặt địa chỉ</p></div></div></div>
  <div class="cta"><button class="btn primary lg">${I.search(18)}Đặt địa chỉ Nhà</button><button class="btn text muted">Để sau</button></div>`]);
F.push(['disclosure', 'Giải thích quyền (hộp nổi bật Play bắt buộc, hiện TRƯỚC hộp xin quyền)', `${head}${steps(1)}
  <h2 class="hero-title">Về đến nơi, ${pn} biết ngay</h2>
  <p class="body ink" style="margin-top:12px">Dear Embeiu dùng vị trí để báo người ấy khi bạn về Nhà hoặc đến những nơi bạn đã lưu, kể cả khi app đã đóng hoặc không dùng. Địa chỉ và toạ độ chỉ lưu trên máy bạn. Người ấy chỉ thấy tên nơi đến, giờ và mức pin lúc đó. Bạn tắt lúc nào cũng được.</p>
  <p class="lbl" style="margin-top:20px">${pn} sẽ nhận được</p>${push(`${me} đã đến Công ty`, 'Nhắn một câu hỏi thăm nhé')}
  <p style="margin-top:12px"><a href="#" style="color:var(--navy);font-size:14px;font-weight:700">Chính sách bảo mật</a></p>
  <div class="cta"><button class="btn primary lg" data-go="os1">Đồng ý, tiếp tục</button><button class="btn text muted">Để sau</button></div>`]);
F.push(['os1', 'Hộp của hệ thống: vị trí khi dùng app + chính xác (chỉ khi chưa có)', `
  <div class="os"><div class="b"><b>Cho phép “Dear Embeiu” sử dụng vị trí của bạn?</b>Dear Embeiu đọc vị trí khi bạn chọn “Dùng vị trí hiện tại” để lưu một nơi, và để nhận ra khi bạn đến nơi đó. Toạ độ chỉ nằm trên máy bạn.</div><div class="o">Cho phép một lần</div><div class="o" style="font-weight:600">Cho phép khi dùng ứng dụng</div><div class="o">Không cho phép</div></div><p class="oslabel">iOS · NSLocationWhenInUseUsageDescription</p>
  <div class="osand" style="margin-top:20px"><b>Cho phép Dear Embeiu truy cập vị trí của thiết bị này?</b><div class="opt on"><i></i>Chính xác</div><div class="opt"><i></i>Gần đúng</div><div class="opt" style="color:#0B57D0;font-weight:500">Trong khi dùng ứng dụng</div><div class="opt" style="color:#0B57D0;font-weight:500">Chỉ lần này</div><div class="opt" style="color:#0B57D0;font-weight:500">Không cho phép</div></div><p class="oslabel">Android 12+</p>
  <div class="cta"><button class="btn primary lg" data-go="always">Giả lập: đã cho phép</button></div>`]);
F.push(['always', 'Trước khi xin “Luôn luôn” (iOS)', `${head}${steps(2)}
  <h2 class="hero-title">Chọn “Luôn luôn”</h2>
  <p class="body ink" style="margin-top:12px">Để tự báo cả lúc app đang đóng, chọn “Luôn luôn” ở trang tiếp theo.</p>
  <p class="lbl" style="margin-top:20px">Trang tiếp theo trông như thế này</p>
  <div class="optlist" role="img" aria-label="Danh sách quyền vị trí, mục Luôn luôn được chọn"><div>Không bao giờ</div><div>Hỏi lần sau</div><div>Khi dùng ứng dụng</div><div class="on">Luôn luôn ${I.tick(18)}</div></div>
  <div class="hint">${I.info(16)}<span>Đừng vuốt tắt Dear Embeiu trong đa nhiệm. App bị vuốt tắt thì iPhone có thể không báo được.</span></div>
  <div class="cta"><button class="btn primary lg" data-go="done">Tiếp tục</button><button class="btn text muted" data-go="partial">Để sau, mình bấm tay</button></div>`]);
F.push(['always-android', 'Trước khi xin “Cho phép mọi lúc” (Android)', `${head}${steps(2)}
  <h2 class="hero-title">Chọn “Cho phép mọi lúc”</h2>
  <p class="body ink" style="margin-top:12px">Để tự báo cả lúc app đang đóng, chọn “Cho phép mọi lúc” ở trang tiếp theo.</p>
  <p class="lbl" style="margin-top:20px">Trang tiếp theo trông như thế này</p>
  <div class="optlist" role="img" aria-label="Trang quyền vị trí Android, mục Cho phép mọi lúc được chọn"><div class="on">Cho phép mọi lúc ${I.tick(18)}</div><div>Chỉ cho phép khi đang dùng ứng dụng</div><div>Luôn hỏi</div><div>Không cho phép</div></div>
  <div class="hint">${I.info(16)}<span>Máy Xiaomi, Oppo, Vivo: bật thêm Tự khởi động cho Dear Embeiu để tin báo không bị chặn.</span></div>
  <div class="cta"><button class="btn primary lg">Mở trang quyền</button><button class="btn text muted">Để sau, mình bấm tay</button></div>`]);
F.push(['done', 'Xong (đã có Luôn luôn)', `${head}
  <h2 class="hero-title">Đã bật báo về nhà</h2>
  <p class="body" style="margin-top:12px">Từ giờ về đến Nhà là ${pn} biết. Muốn tắt thì vào Cài đặt → Về đến nhà. Tắt là tin gần nhất bị xoá, ${pn} không nhận thông báo nào.</p>
  <div class="card" style="margin-top:20px"><div class="place"><span class="badge">${I.loc(20)}</span><div class="tx"><p class="tt">Tự báo khi đến Nhà</p><p class="ts">Thêm Công ty, phòng gym… để báo cả những chỗ đó</p></div><span style="color:var(--tertiary);display:flex">${I.chev()}</span></div></div>
  <div class="cta"><button class="btn primary lg">Về trang chủ</button></div>`]);
F.push(['partial', 'Dừng giữa chừng (từ chối hoặc chưa có Luôn luôn)', `${head}
  <h2 class="hero-title">Tạm thời bạn báo bằng tay</h2>
  <p class="body" style="margin-top:12px">Mỗi lần về, bấm “Về nhà rồi” trên thẻ Home. ${pn} nhận tin y như lúc máy tự báo. Các nơi đã lưu vẫn giữ nguyên.</p>
  <div class="cta"><button class="btn primary lg">Về trang chủ</button></div>`]);

document.getElementById('m').innerHTML = F.map(([id, h, html]) => `<section class="frame${html.includes('class="cta"') && id !== 'os1' ? ' ph' : ''}" id="${id}"><h2 class="lbl" style="margin-bottom:14px">${h}</h2>${html}</section>`).join('');
document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-go]'); if (b) document.getElementById(b.dataset.go).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
</script>
</body>
</html>
