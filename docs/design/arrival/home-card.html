<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrival · thẻ Home · mock bấm thử</title>
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="card.js"></script>
</head>
<body>
<header class="doc">
  <h1>Thẻ Home “Về đến nhà chưa?”</h1>
  <p>Một thẻ, mọi trạng thái. Tuấn và Thảo, thứ Ba 20/10/2026, 19:05. Bấm “Về nhà rồi” hoặc “Hỏi thăm” để thử.</p>
</header>
<main id="m"></main>
<script>
const { I } = UI; const C = ArrivalCard.card; const e = D.docs.u_thao.last;
const sleep = `<article class="card" aria-label="Thẻ Đêm qua có sẵn">
  <div class="card-h"><span class="badge" style="background:rgba(124,92,214,.12);color:#7C5CD6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span><span class="t">Đêm qua</span><span class="chev">${I.chev()}</span></div>
  <div style="display:grid;grid-template-columns:1fr 1px 1fr;gap:0 14px;margin-top:14px">
    <div><div class="who"><i style="background:var(--tuan)"></i>Bạn</div><p style="margin-top:8px"><b style="font-size:22px">6</b><b style="font-size:13px;color:var(--muted)">g </b><b style="font-size:22px">50</b><b style="font-size:13px;color:var(--muted)">p</b></p><p class="fine num">00:15–07:05</p></div>
    <div style="background:var(--hair)"></div>
    <div><div class="who"><i style="background:var(--thao)"></i>Thảo</div><p style="margin-top:8px"><b style="font-size:22px">7</b><b style="font-size:13px;color:var(--muted)">g </b><b style="font-size:22px">20</b><b style="font-size:13px;color:var(--muted)">p</b></p><p class="fine num">23:40–07:00</p></div>
  </div></article>`;
const S = [
  ['Vị trí đề xuất: ngay dưới “Đêm qua”, cùng cụm người ấy hôm nay', sleep + '<div style="height:12px"></div>' + C({ partner: 'event', event: e, mine: 'auto' }) + '', 'Hai thẻ cùng ngôn ngữ: chấm màu người, tên viết hoa nhỏ, khoảng cách 12 giữa hai thẻ. Bấm thử hai nút.', 'live'],
  ['Lần đầu, cả hai chưa bật', C({ pitch: true })],
  ['Thảo vừa rời chỗ làm (không có thông báo đẩy)', C({ partner: 'event', event: D.thaoToday[2], mine: 'auto' })],
  ['Tin từ hôm qua, Thảo bấm tay', C({ partner: 'event', event: D.yesterday, mine: 'auto' }), 'Tin cũ hơn 3 ngày thì ẩn, thẻ chuyển sang trạng thái “đang bật” bên dưới.'],
  ['Thảo đang bật, 3 ngày chưa có tin', C({ partner: 'quiet', mine: 'auto' })],
  ['Thảo chưa bật hoặc đã tắt (trung tính, không nút giục)', C({ partner: 'off', mine: 'auto' })],
  ['Bạn chưa bật, Thảo đã bật', C({ partner: 'event', event: e, mine: 'off' })],
  ['Thiếu quyền vị trí Luôn luôn', C({ partner: 'event', event: e, mine: 'needAlways' })],
  ['Tắt từ xa (config/app.arrivalAutoEnabled = false)', C({ partner: 'event', event: e, mine: 'remoteOff' })],
  ['Đã bật nhưng chưa lưu Nhà', C({ partner: 'event', event: e, mine: 'noHome', places: [] })],
  ['Vừa bấm “Về nhà rồi”', C({ partner: 'event', event: e, mine: 'auto', sent: 'home' }), 'Dòng trạng thái đổi thành lời xác nhận trong 4 giây; nút giữ nguyên nhãn và bề rộng, chỉ đổi icon.'],
  ['Mất mạng lúc bấm', C({ partner: 'event', event: e, mine: 'offline' })],
  ['Ghi lỗi', C({ partner: 'event', event: e, mine: 'error' })],
  ['Đang tải', C({ loading: true })],
];
document.getElementById('m').innerHTML = S.map(([h, html, note, id]) => `<section class="state"${id ? ` id="${id}"` : ''}><h2>${h}</h2>${html}${note ? `<p class="note">${note}</p>` : ''}</section>`).join('');
const live = document.getElementById('live');
live.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'manual') { const art = b.closest('article'); const place = b.dataset.place; art.outerHTML = C({ partner: 'event', event: e, mine: 'auto', sent: place }); setTimeout(() => { const a2 = live.querySelectorAll('article')[1]; a2.outerHTML = C({ partner: 'event', event: e, mine: 'auto' }); }, 4000); }
  if (b.dataset.act === 'care') { b.closest('.lane').insertAdjacentHTML('afterend', `<div class="strip" role="status">${I.care(18)}<span class="s">Mở “Gửi quan tâm”, gợi ý sẵn: Về tới nơi rồi thì nghỉ ngơi nhé</span></div>`); b.disabled = true; }
});
</script>
</body>
</html>
