<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>So sánh Home bản D, E, F · Dear Embeiu</title>
<link rel="stylesheet" href="home.css">
<script src="data.js"></script>
<script src="ui.js"></script>
</head>
<body>
<main>
<div style="max-width:844px;margin:0 auto;padding:24px 16px 0"><h1 style="font-size:22px;line-height:28px;font-weight:700;margin:0 0 4px">Ba bố cục Home: D, E, F</h1>
<p style="font-size:14px;line-height:20px;margin:0 0 20px">Cùng máy Tuấn, thứ Ba 20/10/2026 lúc 19:05, cùng dữ liệu, không có Sổ tiền (đang tắt trong app). D giữ từng thẻ, chia nhóm. E đổi bốn thẻ xem nhanh và hai trò chơi thành ô hai cột. F như E, thêm thẻ đếm gọn. Thanh điều hướng nổi ẩn đi để đọc trọn chiều dài.</p></div>
<div class="cmp" id="cmp" style="--cols:3"></div>
</main>
<script>
const col = (id, title, html) => `<section class="col" aria-labelledby="${id}"><div class="lab"><h2 id="${id}">${title}</h2><p class="len num" data-len="${id}">… px</p></div><div class="frame" data-frame="${id}">${html}</div></section>`;
document.getElementById('cmp').innerHTML =
  col('e', 'E · Bảng ô', UI.homeE(D.S, { h1: false })) +
  col('f', 'F · Bảng ô + thẻ đếm gọn', UI.homeF(D.S, { h1: false })) +
  col('d', 'D · Nhóm (đã code)', UI.homeD(D.S, { h1: false }));
function measure() {
  const out = {};
  document.querySelectorAll('[data-frame]').forEach((f) => {
    const sc = f.querySelector('.scroll'), last = f.querySelector('.cinema');
    out[f.dataset.frame] = Math.round(last.getBoundingClientRect().bottom - sc.getBoundingClientRect().top);
  });
  for (const [k, v] of Object.entries(out)) document.querySelector(`[data-len="${k}"]`).innerHTML = `${v.toLocaleString('vi-VN')} px <span>cuộn</span>`;
  for (const k of ['e', 'f']) { const d = out[k] - out.d; document.querySelector(`[data-len="${k}"]`).innerHTML += ` <span>(${d >= 0 ? '+' : ''}${d.toLocaleString('vi-VN')} so với D)</span>`; }
  window.LENGTHS = out;
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(measure);
</script>
</body>
</html>
