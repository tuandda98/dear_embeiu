<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thời tiết hai nơi, màn Quan tâm điền sẵn · Dear Embeiu</title>
<link rel="stylesheet" href="weather.css">
<style>
  /* Chép từ care_message_screen.dart: màn đã có, feature chỉ thêm initialTitle/initialBody */
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick { background: rgba(255,255,255,.86); border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
  .composer { margin-top: 22px; }
  .flabel { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); letter-spacing: .2px; margin-bottom: 8px; }
  .flabel + .flabel, .inp + .flabel { margin-top: 16px; }
  .inp { display: block; width: 100%; border: 0; border-radius: var(--r-input); background: var(--soft); font: inherit; font-size: 16px; color: var(--ink); padding: 14px 16px; resize: none; line-height: 1.45; }
  .inp:focus { outline: none; box-shadow: inset 0 0 0 1.4px var(--rose); }
  .count { display: block; text-align: right; font-size: 12px; color: var(--ink2); margin-top: 6px; }
  .send { margin-top: 18px; }
  h1.chip { margin: 0; }
</style>
<script src="data.js"></script>
<script src="ui.js"></script>
</head>
<body>
<main class="screen" id="app"></main>
<script>
const { ic, I } = UI, X = WX.places;
const kind = new URLSearchParams(location.search).get('c') || 'rain';
const p = { rain: X.hcm, hot: X.bh, cold: X.sp }[kind];
const f = WX.prefill(kind, p);
console.assert(f.title.length <= 60 && f.body.length <= 200, 'Điền sẵn lọt giới hạn care-message');
const picks = ['Nhớ quá 💕', 'Uống nước nha 💧', 'Ăn cơm chưa? 🍚', 'Ngủ sớm nha 🌙', 'Yêu nhiều lắm ❤️', 'Cố lên nha 💪']; // taste-skill-ignore
document.getElementById('app').innerHTML = `
  <div class="subhead"><a class="back" href="home.html" aria-label="Quay lại">${ic(I.back)}</a>
    <span class="chipwrap"><h1 class="chip">${ic(I.heartB, true)}Quan tâm</h1></span><span></span></div>
  <h2 class="section-title" style="margin-top:20px">Gợi ý nhanh</h2>
  <div class="picks">${picks.map((x) => `<button class="pick" type="button">${x}</button>`).join('')}</div>
  <section class="card composer" aria-label="Soạn lời quan tâm">
    <label class="flabel" for="t">Tiêu đề</label>
    <input class="inp" id="t" maxlength="60" value="${f.title}">
    <label class="flabel" for="b">Lời nhắn</label>
    <textarea class="inp" id="b" rows="3" maxlength="200">${f.body}</textarea>
    <span class="count" aria-live="polite">${f.body.length}/200</span>
  </section>
  <a class="btn lg send" href="home.html">Gửi cho người ấy 💌</a>`; // taste-skill-ignore: careMessageSendCta hiện có
const b = document.getElementById('b'), c = document.querySelector('.count');
b.addEventListener('input', () => { c.textContent = `${b.value.length}/200`; });
</script>
</body>
</html>
