<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dear Embeiu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 60%, #fbcfe8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1f2937;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(236,72,153,0.14), 0 4px 16px rgba(0,0,0,0.05);
    }
    .logo { font-size: 56px; margin-bottom: 20px; }
    h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #ec4899, #be185d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .tagline {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.link {
      display: block;
      padding: 16px 24px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s, transform 0.15s;
    }
    a.link:hover { opacity: 0.85; transform: translateY(-1px); }
    .link-primary { background: linear-gradient(135deg, #ec4899, #be185d); color: white; }
    .link-secondary { background: #f9fafb; color: #374151; border: 1.5px solid #f3f4f6; }
    footer { margin-top: 36px; font-size: 13px; color: #d1d5db; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💌</div>
    <h1>Dear Embeiu</h1>
    <p class="tagline">Lưu giữ kỷ niệm và đếm từng ngày yêu cùng người ấy</p>
    <div class="links">
      <a class="link link-primary" href="privacy-policy.html">📄 Chính sách quyền riêng tư</a>
      <a class="link link-secondary" href="account-deletion.html">🗑️ Yêu cầu xoá tài khoản</a>
    </div>
    <footer>© 2026 Dear Embeiu</footer>
  </div>
</body>
</html>
