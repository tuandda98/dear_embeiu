    (function () {
      var el = function (name) {

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.7s). The phone and recording are static from t=0 (hard cut in).

      tl.fromTo(
        el("chip"),
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.04,
      );

      // Headline: per-word staggered reveal. Onsets are pre-computed once from each
      // word's length (dynamic-content-sequencing), so longer words hold the cursor a
      // touch longer; the last word lands at ≈ 0.70s.
      var HEAD_AT = 0.1;
      var WORD_BASE = 0.016;
      var WORD_PER_CHAR = 0.007;
      var WORD_DUR = 0.3;
      var cursor = HEAD_AT;
      var WORDS = Array.prototype.map.call(
        el("headline").querySelectorAll("span"),
        function (word) {
          var start = cursor;
          cursor += WORD_BASE + word.textContent.length * WORD_PER_CHAR;
          return { word: word, start: start };
        },
      );
      WORDS.forEach(function (entry) {
        tl.fromTo(
          entry.word,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: WORD_DUR, ease: "power2.out" },
          entry.start,
        );
      });

      // The old card ghost fades in at its fixed spot, then its "…" fades in beneath it.

      // Scene 2 (0.7–3.6s): hold. The recording carries type → send → reveal + confetti.

      // settled by the 3.8s poster) while the ghost gives up: the wrapper dims so the
      // card goes 45% → 25% and its "…" fades in proportion. Then hold.
