      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.6s): the lock screen wakes. Clock group pops in from 96%, smooth settle.

        "#f01-notification-lockup-inner",
        { opacity: 0, scale: 0.96 },

      // faint while the card is still behind the digits, then solidifies as it lands.

        "#f01-notification-drop",
        { y: -368 },
        { y: 0, duration: 0.7, ease: "expo.out" },
        0.6
      );
      tl.fromTo(

        { scale: 0.78 },
        { scale: 1, duration: 0.6, ease: "power3.out" },
        0.6

        "#f01-notification-card",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.in" },
        0.6
      );
      // As it lands the phone "lights up": scrim +10%, wallpaper +1%. One tween each, then locked.

        "#f01-notification-scrim",
        { opacity: 0.55 },
        { opacity: 0.65, duration: 0.5, ease: "power2.out" },
        0.88
