      // Scene 1 (0.0–0.8s): the chip pops in (spring-pop-entrance, power3 smooth settle),

      tl.fromTo(

        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.04,

      // Scene 2 (0.8–2.0s): a beat of nothing, then one slam that LANDS on the music's first
      // downbeat. Scale + blur + opacity per kinetic-beat-slam; the attack is shorter than the
      // recipe's 0.35–0.6s so the impact resolves on the beat instead of ~0.2s ahead of it.
      // power2.out = smooth settle, no overshoot.
      var DOWNBEAT = 1.0;
      var SLAM = 0.2;
      tl.fromTo(
        el("headline"),
        { scale: 1.3, opacity: 0, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: SLAM, ease: "power2.out" },

      var WORD_BASE = 0.02;
      var WORD_PER_CHAR = 0.008;
      var WORD_DUR = 0.34;
      var cursor = SUB_AT;
      var WORDS = Array.prototype.map.call(el("sub").children, function (word) {
        var start = cursor;
        cursor += WORD_BASE + word.textContent.length * WORD_PER_CHAR;
        return { word: word, start: start };
      });
