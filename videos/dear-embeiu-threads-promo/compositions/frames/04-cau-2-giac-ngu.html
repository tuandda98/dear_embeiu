      // Per-word staggered reveal; onsets pre-computed from each word's length

      var WORD_BASE = 0.02;

      var WORD_DUR = 0.32;

        tl.fromTo(word, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: WORD_DUR, ease: "power2.out" }, cursor);
        cursor += WORD_BASE + word.textContent.length * WORD_PER_CHAR;
      });

      // The 60% lives in the dots' ink colour, so the element itself fades to 1.
      tl.fromTo(el("dots"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.4);

      tl.fromTo(
        el("callout"),
        { x: -60, scale: 0, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.0,
      );

      var TARGET_MINUTES = 6 * 60 + 50;
      var COUNT_AT = 4.06;
      var COUNT_DUR = 0.8;
      var START_SCALE = 0.6;

      var m1 = el("m1");
      var m2 = el("m2");

        state,
        { minutes: 0 },
        {
          minutes: TARGET_MINUTES,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            var total = Math.round(state.minutes);
            var minutes = total % 60;
            hh.textContent = Math.floor(total / 60);
            m1.textContent = Math.floor(minutes / 10);
            m2.textContent = minutes % 10;
          },
        },
        COUNT_AT,

      tl.fromTo(

        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        COUNT_AT,
